<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Seamless connectivity</title><desc id="d">A contactless network connects phones, terminals, and payment devices.</desc>
<style>
.k{fill:#000000}.y{fill:#FFCC00}.w{fill:#FFFFFF}.c{fill:#263238}.s{fill:#40545C}.ln{fill:none;stroke:#000000;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#D9DEE1;stroke-width:6;stroke-linecap:round}
@keyframes network-pulse{0%,78%,100%{transform:scale(1)}86%{transform:scale(1.04)}92%{transform:scale(1)}}
.network-core{transform-box:view-box;transform-origin:400px 300px;animation:network-pulse 5.8s ease-in-out infinite}
@keyframes network-flow{to{stroke-dashoffset:-48}}
.network-links{animation:network-flow 3.2s linear infinite}
@media(prefers-reduced-motion:reduce){.network-core,.network-links{animation:none}}
</style>

