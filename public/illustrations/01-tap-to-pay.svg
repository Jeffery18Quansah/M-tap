<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Tap to pay</title><desc id="d">A customer taps a phone beside a contactless payment terminal.</desc>
<style>
.k{fill:#000000}.y{fill:#FFCC00}.w{fill:#FFFFFF}.c{fill:#263238}.s{fill:#40545C}.ln{fill:none;stroke:#000000;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#D9DEE1;stroke-width:6;stroke-linecap:round}
@keyframes contactless-pulse{0%,82%,100%{opacity:.82;transform:scale(1)}88%,94%{opacity:1;transform:scale(1.1)}}
.contactless-waves{transform-box:fill-box;transform-origin:center;animation:contactless-pulse 4.8s ease-in-out infinite}
@keyframes confirmation-bounce{0%,80%,100%{transform:translateY(0)}84%{transform:translateY(-7px)}88%{transform:translateY(0)}92%{transform:translateY(-3px)}96%{transform:translateY(0)}}
.confirmation-badge{transform-box:view-box;transform-origin:680px 105px;animation:confirmation-bounce 4.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.contactless-waves,.confirmation-badge{animation:none}}
</style>

<ellipse cx="410" cy="530" rx="260" ry="22" fill="#E9ECEF"/>
<rect x="440" y="105" width="205" height="395" rx="28" class="c"/><rect x="455" y="130" width="175" height="345" rx="16" class="w"/>
<rect x="480" y="175" width="125" height="72" rx="12" fill="#FFF4CC"/><path d="M505 210q37-38 74 0m-57 18q23-25 46 0" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
<circle cx="542" cy="425" r="18" class="y"/><g transform="rotate(-12 260 340)"><rect x="150" y="185" width="155" height="300" rx="25" class="s"/><rect x="163" y="207" width="129" height="250" rx="14" class="w"/><rect x="184" y="270" width="88" height="75" rx="12" fill="#FFF4CC"/><path d="M198 309q30-31 60 0" class="ln"/></g>
<path d="M320 350q25-32 52-20 16 8 4 28l-13 23 55-12q24-4 26 17 1 13-17 26l-39 28q-25 16-52 0l-52-34Z" fill="#F3A39A" stroke="#000000" stroke-width="7"/>
<path class="contactless-waves" d="M330 140q50-55 100 0m-78 20q28-31 56 0" fill="none" stroke="#FFCC00" stroke-width="12" stroke-linecap="round"/>
<g class="confirmation-badge"><circle cx="680" cy="105" r="48" class="y"/><path d="m657 105 17 18 34-40" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g></svg>